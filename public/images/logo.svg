<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Color Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="30" fill="url(#bgGrad2)" />

  <!-- Outer Ring with Dynamic Dash -->
  <circle cx="300" cy="270" r="190" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="800 50" />
  <circle cx="300" cy="270" r="170" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Badminton Racket Silhouette Background -->
  <g transform="translate(300, 270) rotate(-45)">
    <ellipse cx="0" cy="-120" rx="75" ry="95" fill="none" stroke="url(#orangeGrad)" stroke-width="12" />
    <path d="M -50,-120 L 50,-120 M -60,-90 L 60,-90 M -60,-150 L 60,-150 M -30,-180 L -30,-60 M 0,-190 L 0,-50 M 30,-180 L 30,-60" 
          stroke="#FDBA74" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="-25" x2="0" y2="140" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" />
    <rect x="-8" y="140" width="16" height="60" rx="5" fill="#F97316" />
  </g>

  <!-- Soccer Ball & Shuttlecock Core -->
  <g transform="translate(300, 270)">
    <!-- Shuttlecock Feathers -->
    <g fill="url(#whiteGrad)" opacity="0.95">
      <path d="M -20,-30 Q -110,-120 -80,-190 Q -40,-150 -10,-50 Z" />
      <path d="M -10,-40 Q -50,-160 -20,-210 Q 0,-160 0,-50 Z" />
      <path d="M 10,-40 Q 50,-160 20,-210 Q 0,-160 0,-50 Z" />
      <path d="M 20,-30 Q 110,-120 80,-190 Q 40,-150 10,-50 Z" />
    </g>

    <path d="M -65,-120 Q 0,-140 65,-120" stroke="url(#orangeGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M -40,-80 Q 0,-95 40,-80" stroke="url(#orangeGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Central Soccer Ball -->
    <circle cx="0" cy="10" r="55" fill="url(#whiteGrad)" stroke="#064E3B" stroke-width="4" />
    <polygon points="0,10 -18,24 -11,44 11,44 18,24" fill="#064E3B" />
    <polygon points="0,10 -18,24 -36,16 -38,-5 -20,-12" fill="#10B981" />
    <polygon points="0,10 18,24 36,16 38,-5 20,-12" fill="#10B981" />
    <polygon points="-11,44 -30,52 -45,38 -41,18 -18,24" fill="#047857" />
    <polygon points="11,44 30,52 45,38 41,18 18,24" fill="#047857" />
    <polygon points="-11,44 0,63 11,44" fill="#065F46" />
  </g>

  <!-- Speed Motion Lines -->
  <path d="M 120 220 A 180 180 0 0 1 180 140" stroke="#34D399" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 480 220 A 180 180 0 0 0 420 140" stroke="#34D399" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Typography -->
  <text x="300" y="500" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    SMASH &amp; KICK
  </text>
  <text x="300" y="535" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="18" fill="#34D399" text-anchor="middle" letter-spacing="8">
    SM SPORT
  </text>
</svg>
